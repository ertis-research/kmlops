# Deploy with:  k8s/deploy.sh   (reads .env; see README "Kubernetes deployment")
#
# The script creates the Secrets this manifest needs from .env and sets the image (KMLOPS_IMAGE):
# - kmlops-minio-credentials:    kmlops configuration (all its environment variables)
# - kmlops-registry-creds: pull secret for the image (from REGISTRY_SERVER/USERNAME/PASSWORD)
# Applying this file by hand requires both Secrets to exist and `image:` to be edited.
#
# Storage (see README, "Training store"):
# - Default (DB_BACKEND=sqlite): the database is a file in the kmlops-data volume below.
# - PostgreSQL: DB_BACKEND=postgres and the POSTGRES_* variables in .env; the volume is then unused.
#   (The optional "kmlops-postgres" Secret can hold them instead, if they are managed separately.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kmlops-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kmlops
  labels:
    app: kmlops
spec:
  replicas: 1                # SQLite allows a single writer: use DB_BACKEND=postgres for more replicas
  strategy:
    type: Recreate           # the ReadWriteOnce volume cannot be mounted by two pods at once
  selector:
    matchLabels:
      app: kmlops
  template:
    metadata:
      labels:
        app: kmlops
    spec:
      imagePullSecrets:
        - name: kmlops-registry-creds
      containers:
      - name: kmlops
        image: REGISTRY/PROJECT/kmlops:latest   # replaced by KMLOPS_IMAGE from .env (k8s/deploy.sh)
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        # Training Jobs read the MinIO credentials from this Secret (secretKeyRef) instead of getting
        # them in plain text in the Job spec. The default keys (MINIO_ACCESS_KEY / MINIO_SECRET_KEY)
        # are the ones deploy.sh writes. "env" takes precedence over "envFrom".
        - name: MINIO_CREDENTIALS_SECRET
          value: kmlops-minio-credentials
        envFrom:
        - secretRef:
            name: kmlops-minio-credentials
        - secretRef:
            name: kmlops-postgres
            optional: true
        volumeMounts:
        - name: kmlops-data
          mountPath: /data
      volumes:
      - name: kmlops-data
        persistentVolumeClaim:
          claimName: kmlops-data
---
apiVersion: v1
kind: Service
metadata:
  name: kmlops-service
spec:
  type: LoadBalancer   # Use LoadBalancer for cloud clusters, or NodePort/ClusterIP for local
  selector:
    app: kmlops
  ports:
  - protocol: TCP
    port: 8000          # Port exposed to the outside
    targetPort: 8000   # Port uvicorn is listening on inside the container
